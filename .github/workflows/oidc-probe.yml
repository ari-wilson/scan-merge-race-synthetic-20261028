name: Synthetic OIDC compatibility probe
on:
  push:
    branches: [codex/oidc-compatibility-probe]
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    name: synthetic-oidc-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned verifier dependency
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes -r probe-requirements.txt
      - name: Verify token in memory
        run: python probe.py
